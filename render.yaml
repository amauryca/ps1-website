services:
  - type: web
    name: lyricism
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SPOTIFY_CLIENT_ID
        sync: false
      - key: VITE_SPOTIFY_REDIRECT_URI
        value: https://lyricism-9ypi.onrender.com/callback
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
